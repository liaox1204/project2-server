name: Deploy Trigger Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取后端代码
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. 打包后端代码
      - name: Package backend
        run: |
          mkdir -p /tmp/build
          tar -czf /tmp/deploy.tar.gz \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".venv" \
            --exclude="venv" \
            --exclude="__pycache__" \
            --exclude="*.log" \
            --exclude=".env" \
            -C "$GITHUB_WORKSPACE" .

          cp /tmp/deploy.tar.gz "$GITHUB_WORKSPACE/deploy.tar.gz"


      # 3. 上传代码包到服务器
      - name: Upload backend
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/tmp"
          overwrite: true

      # 4. 部署并重启 FastAPI
      - name: Deploy and restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /root/project2Server

            tar -xzf /tmp/deploy.tar.gz \
              -C /root/project2Server

            cd /root/project2Server

            .venv/bin/pip install -r requirements.txt

            systemctl restart project2-api.service

            systemctl is-active project2-api.service

            rm -f /tmp/deploy.tar.gz
